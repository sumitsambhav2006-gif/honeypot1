# ===============================================================================
# Cowrie SSH/Telnet Honeypot Configuration for IHTIP
# ===============================================================================

[honeypot]
# Hostname reported in prompt and banner
hostname = svr01-core-linux
# Architecture shown in uname output
arch = x86_64
# Operating system emulation
kernel_version = 5.15.0-89-generic
kernel_build_string = #99-Ubuntu SMP Mon Oct 30 20:49:16 UTC 2023
# File system simulated environment
filesystem = share/cowrie/fs.pickle
# Download directory for attacker payloads
download_path = var/lib/cowrie/downloads
# Maximum session idle timeout in seconds
interactive_timeout = 300
# Prompt style: user@hostname:path$
auth_class = AuthRandom
# Allow fake root login after N attempts or random
auth_random = 2

[ssh]
# Enable SSH honeypot service
enabled = true
# Port to listen on (forward external 22 to 2222 via iptables/firewall)
listen_endpoints = tcp:2222:interface=0.0.0.0
# SSH version banner string presented to scanning bots
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.4
# Supported authentication methods
auth_none_enabled = false
auth_keyboard_interactive_enabled = true
auth_password_enabled = true
auth_publickey_enabled = true

[telnet]
# Telnet honeypot service (often probed by Mirai IoT bots)
enabled = false
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_json]
# Essential: Output structured JSON logs parsed by IHTIP Log Collector
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false
format = json

[output_textlog]
enabled = true
logfile = var/log/cowrie/cowrie.log
format = text

