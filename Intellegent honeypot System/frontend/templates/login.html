<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyst Authentication - IHTIP Platform</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <style>
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #06090e;
      position: relative;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      background: #0d131f;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 36px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 229, 255, 0.1);
      position: relative;
    }
    .login-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--cyber-cyan), var(--cyber-green));
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .login-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
    }
    .login-desc {
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .form-control {
      width: 100%;
      background: #070a12;
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: var(--cyber-cyan);
      box-shadow: 0 0 10px var(--cyber-cyan-glow);
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      justify-content: center;
    }
    .error-alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--cyber-red);
      color: #fca5a5;
      font-size: 12px;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <div class="login-logo">🛡️</div>
        <h2 class="login-title">IHTIP SECURITY ACCESS</h2>
        <p class="login-desc">RESTRICTED BLUE TEAM PORTAL</p>
      </div>

      <div id="login-error" class="error-alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Operator / Analyst ID</label>
          <input type="text" id="username" class="form-control" placeholder="admin or analyst" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Access Credential</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••••••" required>
        </div>

        <button type="submit" class="btn btn-cyber btn-login">
          AUTHENTICATE SESSION ➔
        </button>
      </form>

      <div style="margin-top: 24px; text-align: center; font-size: 11px; color: var(--text-muted); font-family: var(--font-mono);">
        Default Credentials: <b>admin / admin123</b> or <b>analyst / analyst123</b>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('login-error');
      errBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          window.location.href = '/dashboard';
        } else {
          errBox.innerText = data.message || 'Authentication failed.';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.innerText = 'Network error connecting to auth service.';
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
