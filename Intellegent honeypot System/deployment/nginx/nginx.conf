# ==============================================================================
# Nginx Reverse Proxy Configuration for IHTIP SOC Dashboard
# ==============================================================================

upstream ihtip_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name soc.honeypot.local;

    # Redirect all HTTP traffic to HTTPS in production
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://ihtip_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for Server-Sent Events (SSE) live radar feed
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Static Assets Caching
    location /static/ {
        proxy_pass http://ihtip_backend/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Max upload limit for forensic payload artifacts
    client_max_body_size 25M;
}

